<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Oriya:wght@600;700&amp;display=swap');
      .text-line1 {
        font-family: 'Noto Serif Oriya', 'Nirmala UI', 'Kalinga', 'Segoe UI Historic', serif;
        font-size: 32px;
        font-weight: 700;
        fill: #065f46;
        text-anchor: middle;
      }
      .text-line2 {
        font-family: 'Noto Serif Oriya', 'Nirmala UI', 'Kalinga', 'Segoe UI Historic', serif;
        font-size: 32px;
        font-weight: 700;
        fill: #065f46;
        text-anchor: middle;
      }
      .text-line3 {
        font-family: 'Noto Serif Oriya', 'Nirmala UI', 'Kalinga', 'Segoe UI Historic', serif;
        font-size: 28px;
        font-weight: 700;
        fill: #047857;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Clean White Background -->
  <rect width="100%" height="100%" fill="#ffffff" rx="12" />
  <rect width="100%" height="100%" fill="none" stroke="#cbd5e1" stroke-width="2" rx="12" />

  <!-- Decorative Border Accents -->
  <g fill="none" stroke="#10b981" stroke-width="2" opacity="0.7">
    <!-- Left Accent -->
    <path d="M 40 120 Q 80 80 120 120 Q 80 160 40 120 Z" />
    <circle cx="120" cy="120" r="5" fill="#10b981" />
    <line x1="20" y1="120" x2="140" y2="120" stroke-dasharray="4,4" />

    <!-- Right Accent -->
    <path d="M 1160 120 Q 1120 80 1080 120 Q 1120 160 1160 120 Z" />
    <circle cx="1080" cy="120" r="5" fill="#10b981" />
    <line x1="1060" y1="120" x2="1180" y2="120" stroke-dasharray="4,4" />
  </g>

  <!-- Exact Odia Script Shanti Mantra Lines (କଶ୍ଚିତ୍ & ଭବେତ୍) -->
  <text x="600" y="72" class="text-line1">ॐ ସର୍ବେ ଭବନ୍ତୁ ସୁଖିନଃ, ସର୍ବେ ସନ୍ତୁ ନିରାମୟାଃ।</text>
  <text x="600" y="136" class="text-line2">ସର୍ବେ ଭଦ୍ରାଣି ପଶ୍ୟନ୍ତୁ, ମା କଶ୍ଚିତ୍ ଦୁଃଖଭାଗ୍ ଭବେତ୍।</text>
  <text x="600" y="196" class="text-line3">ॐ ଶାନ୍ତିଃ! ଶାନ୍ତିଃ! ଶାନ୍ତିଃ!</text>
</svg>
